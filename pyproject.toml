[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myfap"
version = "0.2.0"
description = "CLI Tool dựa trên MyFAP API dành cho Sinh Viên FPTU"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    { name="WindowScary321", email="126940686+WindowScary321@users.noreply.github.com" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "pkce>=1.0.3",
    "beautifulsoup4>=4.12.0",
    "ics>=0.7.2",
    "pytz>=2023.3"
]
requires-python = ">=3.9"

[project.scripts]
myfap = "myfap.cli:app"

[tool.setuptools.packages.find]
include = ["myfap*"]

[tool.uv]
# shortcut: greenlet 3.2.5 thiếu wheel Python 3.9 trên Windows; bỏ giới hạn khi có wheel tương thích.
constraint-dependencies = ["greenlet<3.2.5; python_version < '3.10' and sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/WindowScary321/myfap-api-cli"
