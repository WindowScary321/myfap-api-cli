name: Publish to PyPI

on:
  release:
    types: [published]  # Trigger khi tạo Release

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cài Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Cài uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Đồng bộ dependencies
        run: uv sync --locked --group ci

      - name: Chạy regression test
        run: uv run --locked --group ci python -m unittest discover -s tests -v

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
